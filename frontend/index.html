<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F3ED" />
    <meta name="description" content="Aureus Manager — Tu dinero, tus préstamos y tus operaciones bajo control" />
    <title>Aureus Manager</title>
    <meta name="apple-mobile-web-app-title" content="Aureus Manager" />
    <meta name="application-name" content="Aureus Manager" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=aureus3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=aureus3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=aureus3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=aureus3" />
    <link rel="manifest" href="/manifest.webmanifest?v=aureus3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aureus_theme');
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark-mode');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#101C2C');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
