<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131629" />
      <stop offset="100%" stop-color="#0B0E17" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Central Emblem Container -->
  <g filter="url(#glow)">
    <rect x="116" y="116" width="280" height="280" rx="64" fill="url(#emeraldGrad)" />
  </g>

  <!-- Coins / Vault Vector Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Coin 1 (Primary) -->
    <circle cx="236" cy="236" r="64" />
    <path d="M236 200v72M214 218h44M214 254h44" stroke-width="16" />
    
    <!-- Coin 2 (Offset / Depth) -->
    <path d="M276 196a64 64 0 0 1 40 88 64 64 0 0 1-52 36" />
  </g>

  <!-- Subtle Accent Dots -->
  <circle cx="160" cy="160" r="10" fill="#FFFFFF" opacity="0.6" />
  <circle cx="352" cy="352" r="8" fill="#FFFFFF" opacity="0.4" />
</svg>

